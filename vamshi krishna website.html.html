html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:300 14px/1.7 var(--sans);overflow-x:hidden}
a{color:inherit;text-decoration:none}
.mono,.lb{font:400 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dm)}
.g{color:var(--g)}
.w{max-width:1100px;margin:0 auto;padding:0 24px}
nav{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:2px;padding:5px;background:rgba(14,21,34,.85);backdrop-filter:blur(12px);border:1px solid var(--ln);border-radius:99px}
nav a{font:400 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mu);padding:7px 13px;border-radius:99px;transition:.2s}
nav a:hover{color:var(--tx)}nav a.on{background:#18283a;color:var(--g)}
nav a.on[href="#writing"],nav a.on[href="#projects"],nav a.on[href="#speaking"],nav a.on[href="#about"]{background:var(--g);color:#06140c}
.top{position:absolute;top:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 28px;z-index:5}
.logo{font:500 17px var(--sans);letter-spacing:-.03em}.logo b{color:var(--g);font-weight:400}
.open{font:400 10px var(--mono);letter-spacing:.1em;color:var(--mu)}.open:before,.dot:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--g);margin-right:8px;vertical-align:middle}
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:#0a1220}
.hero .ph{position:absolute;inset:0;z-index:2;background:var(--cut) 50% 100%/auto 66% no-repeat;opacity:1;filter:brightness(.92) contrast(1.06);-webkit-mask-image:linear-gradient(#000 78%,transparent 100%);mask-image:linear-gradient(#000 78%,transparent 100%)}.hero .c p{text-shadow:0 1px 14px #050810,0 0 4px #050810}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 45%,#0a1220 100%)}
#net{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.frame{position:absolute;inset:125px 36px 22px;--c:rgba(255,255,255,.45);background:linear-gradient(var(--c),var(--c)) 0 0/12px 1px,linear-gradient(var(--c),var(--c)) 0 0/1px 12px,linear-gradient(var(--c),var(--c)) 100% 0/12px 1px,linear-gradient(var(--c),var(--c)) 100% 0/1px 12px,linear-gradient(var(--c),var(--c)) 0 100%/12px 1px,linear-gradient(var(--c),var(--c)) 0 100%/1px 12px,linear-gradient(var(--c),var(--c)) 100% 100%/12px 1px,linear-gradient(var(--c),var(--c)) 100% 100%/1px 12px;background-repeat:no-repeat;border:1px solid rgba(255,255,255,.06);z-index:3;pointer-events:none}
.frame>*{position:absolute;pointer-events:auto}
.hero .c{position:relative;z-index:4}
.h1{font:400 clamp(64px,11.2vw,230px)/.8 var(--serif);letter-spacing:-.01em;margin:30px 0 36px;color:rgba(255,255,255,.93)}
.h1 span{display:block}.h1 span+span{color:rgba(205,210,218,.55)}.h1 i{display:inline-block;width:.09em;height:.09em;border-radius:50%;background:var(--g);margin-left:.05em;box-shadow:0 0 18px var(--g)}
.btn{display:inline-flex;gap:10px;align-items:center;font:400 12px var(--sans);padding:13px 22px;border:1px solid var(--ln);background:#0d1420;transition:.2s;cursor:pointer;color:var(--tx)}
.btn:hover{border-color:var(--g)}.btn.p{background:var(--g);color:#06140c;border-color:var(--g)}.btn.p:hover{filter:brightness(1.1)}
.sec{padding:100px 0 40px}
h2{font:400 clamp(38px,5.4vw,66px)/1 var(--serif);letter-spacing:-.01em}
h2 em{font-style:normal;color:#8c939c}h2 .g{color:var(--g)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin:14px 0 40px}
.ar:after{content:" ↗";color:var(--mu)}.ln{font:400 11px var(--mono);color:var(--mu);transition:.2s}.ln:hover{color:var(--g)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:60px}
.two p{margin-bottom:16px;color:#b6bdca}
pre.cd{font:400 11px/1.9 var(--mono);color:var(--mu);margin:22px 0;padding-left:14px;border-left:1px solid var(--ln);white-space:pre-wrap}
.tk{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid var(--ln);margin-top:70px;padding-top:22px}
.tk span{font:400 10px var(--mono);color:var(--mu)}
.row{display:grid;grid-template-columns:40px 1fr 140px 30px;gap:18px;align-items:start;padding:30px 24px;border:1px solid var(--ln);border-bottom:0;transition:.25s;background:var(--bg)}
.row:last-of-type{border-bottom:1px solid var(--ln)}.row:hover{background:var(--bg2)}.row:hover h3{color:var(--g)}
.row h3{font:400 28px/1.15 var(--serif);margin:10px 0 6px;transition:.2s}.row p{color:var(--mu);font-size:12.5px}
.row .m{text-align:right}
.tag{display:inline-block;font:400 10px var(--mono);padding:2px 9px;margin-right:6px;border:1px solid var(--ln);color:var(--mu);border-radius:3px}.tag.a{background:#0f2a22;color:var(--g);border-color:#14402f}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{border:1px solid var(--ln);background:var(--bg2);padding:0 28px 28px;transition:.25s}.card:hover{border-color:#23405a}
.card .ic{height:150px;display:grid;place-items:center;color:var(--g);font:400 40px var(--mono);margin:0 -28px 20px;background:radial-gradient(circle at 50% 50%,#10243a,transparent 70%)}
.card h3{font:400 34px/1.1 var(--serif);margin:10px 0 10px}.card p{color:var(--mu);margin-bottom:18px;font-size:13px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.img{position:relative;aspect-ratio:4/3;background:var(--pic) center 22%/cover;border:1px solid var(--ln);filter:grayscale(.5) brightness(.75)}
.talk{aspect-ratio:1290/900;background:var(--scene) center/cover;filter:none}.talk .cap{display:flex;gap:10px;align-items:center;left:30px;bottom:24px;font-size:11px;color:#c5ccd8}

const inC=(t,p,Q)=>{const[a,b,c]=t.map(i=>Q[i]),ax=a.x-p.x,ay=a.y-p.y,bx=b.x-p.x,by=b.y-p.y,cx=c.x-p.x,cy=c.y-p.y,d=(ax*ax+ay*ay)*(bx*cy-cx*by)-(bx*bx+by*by)*(ax*cy-cx*ay)+(cx*cx+cy*cy)*(ax*by-bx*ay),o=(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);return o>0?d>0:d<0};
function del(P,max){const n=P.length,Q=P.concat([{x:-1e5,y:-1e5},{x:1e5,y:-1e5},{x:0,y:1e5}]);let T=[[n,n+1,n+2]];
for(let i=0;i<n;i++){const p=Q[i],bad=[],keep=[];T.forEach(t=>(inC(t,p,Q)?bad:keep).push(t));const ed=[];bad.forEach(t=>[[t[0],t[1]],[t[1],t[2]],[t[2],t[0]]].forEach(e=>{const j=ed.findIndex(f=>(f[0]==e[1]&&f[1]==e[0])||(f[0]==e[0]&&f[1]==e[1]));j<0?ed.push(e):ed.splice(j,1)}));T=keep.concat(ed.map(e=>[e[0],e[1],i]))}
const S=new Set,out=[];T.forEach(t=>{if(t.some(v=>v>=n))return;[[0,1],[1,2],[2,0]].forEach(([a,b])=>{const u=Math.min(t[a],t[b]),v=Math.max(t[a],t[b]),k=u*1000+v;if(!S.has(k)&&Math.hypot(Q[u].x-Q[v].x,Q[u].y-Q[v].y)<max){S.add(k);out.push([u,v])}})});return out}
function net(){const c=$('#net');if(!c)return;const x=c.getContext('2d'),R=devicePixelRatio||1;let W,H,P=[],E=[],m,rx,dd;
const rs=()=>{W=c.width=c.offsetWidth*R;H=c.height=c.offsetHeight*R;m=W/R<700;rx=m?W*.5:Math.min(W*.29,H*.66);const ry=m?rx*1.45:rx*.58,cx=W/2,cy=H*(m?.47:.42);dd=rx*(m?.46:.21);
let s=7;const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
P=[];for(let k=0;k<6000&&P.length<60;k++){const px=rnd()*2-1,py=rnd()*2-1;if(px*px+py*py>1)continue;const X=cx+px*rx,Y=cy+py*ry;if(P.every(q=>Math.hypot(q.x-X,q.y-Y)>dd))P.push({x:X,y:Y,a:rnd()*6.28,s:.0005+rnd()*.0007,r:(.019+rnd()*.016)*rx})}
E=del(P,dd*2)};
rs();addEventListener('resize',rs);
(function f(){if(!document.body.contains(c))return;x.clearRect(0,0,W,H);P.forEach(n=>{n.a+=n.s;n.ox=n.x+Math.cos(n.a)*dd*.05;n.oy=n.y+Math.sin(n.a)*dd*.05});
x.strokeStyle='rgba(105,200,155,'+(m?.32:.4)+')';x.lineWidth=rx*.008;x.lineCap='round';x.beginPath();E.forEach(([u,v])=>{x.moveTo(P[u].ox,P[u].oy);x.lineTo(P[v].ox,P[v].oy)});x.stroke();
x.fillStyle='rgba(150,225,190,.42)';P.forEach(n=>{x.beginPath();x.arc(n.ox,n.oy,n.r,0,6.28);x.fill()});requestAnimationFrame(f)})()}
